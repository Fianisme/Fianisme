name: Metrics
on:
  # Berjalan otomatis setiap jam 00:00 UTC
  schedule: [{cron: "0 0 * * *"}]
  # Mengizinkan kamu menjalankan workflow ini secara manual kapan saja
  workflow_dispatch:
  # Berjalan otomatis setiap ada perubahan di branch main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          # Menggunakan token yang sudah disimpan di Secrets tadi
          token: ${{ secrets.METRICS_TOKEN }}

          # Konfigurasi Dasar
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta # Sesuaikan dengan zona waktumu

          # Contoh Plugin: Menampilkan bahasa pemrograman yang paling sering dipakai
          plugin_languages: yes
          plugin_languages_ignored: html, css # Abaikan bahasa tertentu jika mau
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
